# MeteoRisco — Golden Cases para Evals Completo (EV1–EV8 + EV-GEO-1..5)
#
# Suíte completa de teste de avaliação conforme o Master Plan v1.1.

cases:
  # ─── EVALS DE NEGÓCIO E FUNCIONAIS (EV1 a EV4) ─────────────────────────────
  - id: EV1
    name: "Granizo vermelho em São Paulo para segurados expostos"
    location_id: "sao_paulo"
    metrics:
      precipitation_mm_h: 15.0
      wind_gusts_10m_kmh: 55.0
      weather_code: 99  # granizo forte previsto
      cape_j_kg: 2500.0
      lifted_index: -7.0
    expected:
      eligible_insured_ids: ["INS002", "INS007", "INS011"]  # Auto na rua e residenciais expostos
      suppressed_insured_ids: ["INS016"]  # Paulo Moraes (auto, veiculo_em_garagem_coberta) - suprimido por garagem
      hazard_type: "hail"
      severity: "red"

  - id: EV2
    name: "Chuva intensa Laranja em Belém"
    location_id: "belem"
    metrics:
      precipitation_mm_h: 22.5
      wind_gusts_10m_kmh: 15.0
      weather_code: 95
      cape_j_kg: 1200.0
      lifted_index: -3.0
    expected:
      eligible_insured_ids: ["INS001", "INS006", "INS013", "INS018"]  # Segurados em Belém
      suppressed_insured_ids: []
      hazard_type: "rain_heavy"
      severity: "orange"

  - id: EV3
    name: "Vento forte em Porto Alegre afetando residências com telhado"
    location_id: "porto_alegre"
    metrics:
      precipitation_mm_h: 2.0
      wind_gusts_10m_kmh: 85.0  # vento severo
      weather_code: 95
      cape_j_kg: 100.0
      lifted_index: 0.0
    expected:
      eligible_insured_ids: ["INS003", "INS012"]  # Carla e Lucas (residencial em RS)
      suppressed_insured_ids: []
      hazard_type: "wind_strong"
      severity: "red"

  - id: EV4
    name: "Evento abaixo do limiar (sem comunicação)"
    location_id: "brasilia"
    metrics:
      precipitation_mm_h: 0.0
      wind_gusts_10m_kmh: 5.0
      weather_code: 0
      cape_j_kg: 50.0
      lifted_index: 2.0
    expected:
      eligible_insured_ids: []
      suppressed_insured_ids: ["INS004", "INS009", "INS014", "INS019"] # todos suprimidos
      hazard_type: "no_hazard"
      severity: null

  # ─── EVALS DE CONFORMIDADE E SEGURANÇA (EV5 a EV8) ──────────────────────────
  - id: EV5
    name: "Conformidade: Bloqueio de mensagem com promessa indevida de cobertura"
    location_id: "sao_paulo"
    test_type: "audit_compliance"
    forbidden_body: "Garantimos a indenização automática do seu veículo em caso de danos por granizo."
    expected:
      audit_status: "blocked"
      violation: "promessa_de_cobertura"

  - id: EV6
    name: "Personalização: Mesmo evento gerando ações distintas por ramo"
    location_id: "sao_paulo"
    metrics:
      precipitation_mm_h: 35.0 # Chuva torrencial Vermelha
      wind_gusts_10m_kmh: 60.0
      weather_code: 95
    expected:
      impacted_lines: ["residential", "auto"]
      auto_action_keyword: "mover_veiculo_imediatamente"
      residential_action_keyword: "acao_imediata_recolher_bens"

  - id: EV7
    name: "Resiliência: Acionamento de fallback em falha de API"
    location_id: "recife"
    force_fallback: true
    expected:
      is_fallback: true

  - id: EV8
    name: "Human-in-the-Loop: Respeito à rejeição manual do operador"
    location_id: "sao_paulo"
    operator_rejection_id: "INS002"
    expected:
      simulated_envios_count: 0

  # ─── EVALS MULTI-LOCALIDADE GEOGRÁFICOS (EV-GEO-1 a EV-GEO-5) ─────────────
  - id: EV-GEO-1
    name: "GEO Belém / PA (Norte) - Convecção equatorial"
    location_id: "belem"
    metrics:
      precipitation_mm_h: 32.0
      wind_gusts_10m_kmh: 40.0
      weather_code: 95
    expected:
      hazard_type: "rain_heavy"
      severity: "red"

  - id: EV-GEO-2
    name: "GEO Recife / PE (Nordeste) - Chuvas frontais litorâneas"
    location_id: "recife"
    metrics:
      precipitation_mm_h: 18.0
      wind_gusts_10m_kmh: 45.0
      weather_code: 95
    expected:
      hazard_type: "rain_heavy"
      severity: "orange"

  - id: EV-GEO-3
    name: "GEO Brasília / DF (Centro-Oeste) - Instabilidade de verão"
    location_id: "brasilia"
    metrics:
      precipitation_mm_h: 8.0
      wind_gusts_10m_kmh: 30.0
      weather_code: 95
    expected:
      hazard_type: "rain_heavy"
      severity: "yellow"

  - id: EV-GEO-4
    name: "GEO São Paulo / SP (Sudeste) - Granizo em centro urbano"
    location_id: "sao_paulo"
    metrics:
      precipitation_mm_h: 10.0
      weather_code: 96
      cape_j_kg: 1500.0
      lifted_index: -4.0
      wind_gusts_10m_kmh: 55.0
    expected:
      hazard_type: "hail"
      severity: "orange"

  - id: EV-GEO-5
    name: "GEO Porto Alegre / RS (Sul) - Frente fria com vendaval"
    location_id: "porto_alegre"
    metrics:
      precipitation_mm_h: 10.0
      wind_gusts_10m_kmh: 80.0
      weather_code: 95
    expected:
      hazard_type: "wind_strong"
      severity: "red"
